[package]
name = "nova-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-only"
publish = false
build = "build.rs"

[lib]
name = "nova_core"
crate-type = ["cdylib", "rlib"]

[features]
default = []
ghostty = []

[dependencies]
base64 = "0.22.1"
jni = "0.22.4"
russh = { version = "0.62.2", default-features = false, features = ["ring", "rsa"] }
russh-sftp = "2.3.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
tokio = { version = "1.49.0", features = ["fs", "io-util", "net", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7.18", features = ["rt"] }
zeroize = { version = "1.8.2", features = ["derive"] }

[dev-dependencies]
tempfile = "3.24.0"
