[versions]
agp = "9.3.0"
kotlin = "2.4.10"
composeBom = "2026.06.00"
activity = "1.13.0"
junit = "4.13.2"
coroutines = "1.11.0"
webkit = "1.16.0"
datastore = "1.2.1"
lifecycle = "2.10.0"
core = "1.18.0"
media3 = "1.10.1"
desugarJdkLibs = "2.1.5"
sora = "0.24.4"
androidTreeSitter = "4.3.2"

[libraries]
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity" }
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
androidx-compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended" }
androidx-webkit = { module = "androidx.webkit:webkit", version.ref = "webkit" }
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-core = { module = "androidx.core:core", version.ref = "core" }
androidx-media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
androidx-media3-ui = { module = "androidx.media3:media3-ui", version.ref = "media3" }
desugar-jdk-libs = { module = "com.android.tools:desugar_jdk_libs", version.ref = "desugarJdkLibs" }
sora-editor-bom = { module = "io.github.rosemoe:editor-bom", version.ref = "sora" }
sora-editor = { module = "io.github.rosemoe:editor" }
sora-language-treesitter = { module = "io.github.rosemoe:language-treesitter" }
android-treesitter-c = { module = "com.itsaky.androidide.treesitter:tree-sitter-c", version.ref = "androidTreeSitter" }
android-treesitter-cpp = { module = "com.itsaky.androidide.treesitter:tree-sitter-cpp", version.ref = "androidTreeSitter" }
android-treesitter-java = { module = "com.itsaky.androidide.treesitter:tree-sitter-java", version.ref = "androidTreeSitter" }
android-treesitter-json = { module = "com.itsaky.androidide.treesitter:tree-sitter-json", version.ref = "androidTreeSitter" }
android-treesitter-kotlin = { module = "com.itsaky.androidide.treesitter:tree-sitter-kotlin", version.ref = "androidTreeSitter" }
android-treesitter-properties = { module = "com.itsaky.androidide.treesitter:tree-sitter-properties", version.ref = "androidTreeSitter" }
android-treesitter-python = { module = "com.itsaky.androidide.treesitter:tree-sitter-python", version.ref = "androidTreeSitter" }
android-treesitter-xml = { module = "com.itsaky.androidide.treesitter:tree-sitter-xml", version.ref = "androidTreeSitter" }
junit = { module = "junit:junit", version.ref = "junit" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
